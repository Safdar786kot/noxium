name: release

# Push a tag like v0.1.0 to build Linux / Windows / macOS binaries and publish a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
      env:
        DEBIAN_FRONTEND: noninteractive
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            host: x86_64-linux-gnu
            packages: gperf cmake python3-zmq libdbus-1-dev libharfbuzz-dev
          - name: linux-arm64
            host: aarch64-linux-gnu
            packages: python3 gperf g++-aarch64-linux-gnu
          - name: windows-x64
            host: x86_64-w64-mingw32
            packages: cmake python3 g++-mingw-w64-x86-64
          - name: macos-x64
            host: x86_64-apple-darwin11
            packages: cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools python-dev python3-setuptools-git libtinfo5
          - name: macos-arm64
            host: aarch64-apple-darwin11
            packages: cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools python-dev python3-setuptools-git libtinfo5
    steps:
      - name: dependencies
        run: |
          apt-get update
          apt-get -y install build-essential libtool cmake autotools-dev automake pkg-config python3 gperf bsdmainutils curl git ca-certificates unzip zip ccache ${{ matrix.packages }}
          git config --global --add safe.directory '*'
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: contrib/depends/built
          key: depends-${{ matrix.host }}-${{ hashFiles('contrib/depends/packages/*') }}
      - name: mingw posix threads
        if: matrix.host == 'x86_64-w64-mingw32'
        run: |
          update-alternatives --set x86_64-w64-mingw32-g++ $(which x86_64-w64-mingw32-g++-posix)
          update-alternatives --set x86_64-w64-mingw32-gcc $(which x86_64-w64-mingw32-gcc-posix)
      - name: build
        run: make depends target=${{ matrix.host }} -j$(nproc)
      - name: package
        shell: bash
        run: |
          V=${GITHUB_REF_NAME}
          D=noxium-${{ matrix.name }}-$V
          mkdir -p dist/$D
          cp build/${{ matrix.host }}/release/bin/noxium* dist/$D/
          cp README.md LICENSE SECURITY_REVIEW.md assets/logo/noxium-logo-256.png dist/$D/
          cd dist
          if [[ "${{ matrix.host }}" == *mingw32 ]]; then zip -qr $D.zip $D; else tar -czf $D.tar.gz $D; fi
          rm -rf $D
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
